    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - GROOVEBOX</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff006e;
            --neon-yellow: #ffbe0b;
            --deep-purple: #1a0033;
            --dark-bg: #0a0014;
            --white: #ffffff;
            --gray: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--dark-bg);
            color: var(--white);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(10, 0, 20, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-cyan);
            z-index: 1000;
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2rem;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            position: relative;
            transition: color 0.3s;
        }

        .nav-links a.active {
            color: var(--neon-cyan);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--neon-pink);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--neon-pink);
            color: var(--dark-bg);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .cart-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .cart-header {
            margin-bottom: 3rem;
        }

        .cart-header h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 4rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 1.5rem;
            align-items: center;
            transition: border-color 0.3s;
        }

        .cart-item:hover {
            border-color: var(--neon-cyan);
        }

        .item-image {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--deep-purple), var(--dark-bg));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .item-details h3 {
            font-family: 'Archivo Black', sans-serif;
            color: var(--neon-yellow);
            margin-bottom: 0.5rem;
        }

        .item-details p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-end;
        }

        .item-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            background: var(--neon-pink);
            border: none;
            color: var(--dark-bg);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .quantity-btn:hover {
            transform: scale(1.1);
        }

        .quantity {
            min-width: 30px;
            text-align: center;
            font-weight: 700;
        }

        .remove-btn {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 0.5rem 1rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .remove-btn:hover {
            background: var(--neon-pink);
            color: var(--dark-bg);
        }

        .cart-summary {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--neon-cyan);
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .cart-summary h2 {
            font-family: 'Archivo Black', sans-serif;
            color: var(--neon-cyan);
            margin-bottom: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-row:last-child {
            border-bottom: none;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--neon-yellow);
            margin-top: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--neon-pink);
            border: none;
            color: var(--dark-bg);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            background: var(--neon-yellow);
            transform: scale(1.02);
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-cart h2 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2rem;
            color: var(--gray);
            margin-bottom: 2rem;
        }

        .continue-shopping {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--neon-cyan);
            color: var(--dark-bg);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            transition: transform 0.3s;
        }

        .continue-shopping:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: 6rem;
            padding: 3rem 2rem;
            text-align: center;
            border-top: 2px solid var(--neon-pink);
            background: rgba(10, 0, 20, 0.8);
        }

        footer p {
            color: var(--gray);
        }

        @media (max-width: 968px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
            }

            .item-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        @media (max-width: 768px) {
            .cart-header h1 {
                font-size: 2.5rem;
            }

            .nav-links {
                gap: 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5MGH8VBG"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
    <header>
        <nav>
            <div class="logo" onclick="window.location.href='index.html'">GROOVEBOX</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html" class="active">Cart</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <div class="cart-icon" onclick="window.location.href='cart.html'">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </nav>
    </header>

    <div class="cart-container">
        <div class="cart-header">
            <h1>YOUR CART</h1>
        </div>

        <div id="cartContentArea"></div>
    </div>

    <footer>
        <p>&copy; 2026 GROOVEBOX. All rights reserved.</p>
    </footer>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('cart')) || [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        function updateQuantity(id, change) {
            const cart = getCart();
            const item = cart.find(item => item.id === id);
            
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeItem(id);
                } else {
                    saveCart(cart);
                }
            }
        }

        function removeItem(id) {
            let cart = getCart();
            cart = cart.filter(item => item.id !== id);
            saveCart(cart);
        }

        function calculateSubtotal() {
            const cart = getCart();
            return cart.reduce((total, item) => total + (item.price * item.quantity), 0);
        }

        function updateCartCount() {
            const cart = getCart();
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function renderCart() {
            const cart = getCart();
            const contentArea = document.getElementById('cartContentArea');

            if (cart.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p style="color: var(--gray); margin-bottom: 2rem;">Add some vinyl to your collection!</p>
                        <a href="shop.html" class="continue-shopping">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            const subtotal = calculateSubtotal();
            const tax = subtotal * 0.1;
            const total = subtotal + tax;

            contentArea.innerHTML = `
                <div class="cart-content">
                    <div class="cart-items">
                        ${cart.map(item => `
                            <div class="cart-item">
                                <div class="item-image">🎵</div>
                                <div class="item-details">
                                    <h3>${item.name}</h3>
                                    <p>Price: $${item.price.toFixed(2)}</p>
                                </div>
                                <div class="item-actions">
                                    <div class="item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                                    <div class="quantity-controls">
                                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                                        <span class="quantity">${item.quantity}</span>
                                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                                    </div>
                                    <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="cart-summary">
                        <h2>ORDER SUMMARY</h2>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>$${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax (10%)</span>
                            <span>$${tax.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>TOTAL</span>
                            <span>$${total.toFixed(2)}</span>
                        </div>
                        <button class="checkout-btn" onclick="window.location.href='checkout.html'">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize
        updateCartCount();
        renderCart();
    </script>
</body>
</html>
